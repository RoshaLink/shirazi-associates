name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; skip queued runs and finish the in-progress one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, not npm install — see CLAUDE.md: a plain install has re-resolved
      # ~9k lines of the lockfile on this project without any package.json change.
      - run: npm ci

      - run: npm run generate
        env:
          # This is a project site (roshalink.github.io/shirazi-associates), so
          # every route and asset needs the /shirazi-associates/ prefix.
          NUXT_APP_BASE_URL: /shirazi-associates/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
